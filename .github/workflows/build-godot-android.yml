name: Build Godot 3D Runner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest"

      - name: Download Godot and export templates
        run: |
          set -e
          GODOT_VERSION="4.6.2"
          GODOT_TAG="4.6.2-stable"
          GODOT_BIN="Godot_v${GODOT_TAG}_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BIN}.zip"
          unzip -q "${GODOT_BIN}.zip"
          chmod +x "${GODOT_BIN}"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -O export_templates.tpz
          unzip -q export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS


      - name: Install optional CC0 game assets
        run: |
          set -e
          bash tools/install_cc0_assets.sh || true
          find assets -maxdepth 3 -type f | sed 's#^#asset: #' | head -80

      - name: Export Android debug APK
        run: |
          set -e
          mkdir -p build
          ./Godot_v4.6.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/GameBox3DRunner-debug.apk
          ls -lah build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBox3DRunner-debug-apk
          path: build/GameBox3DRunner-debug.apk
